<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지문분석기 · 학습자료 제작소</title>
<link rel="stylesheet" href="/static/design-tokens.css">
<style>
  *{box-sizing:border-box;}
  body{margin:0; padding:0 20px 80px;}
  .wrap{max-width:900px; margin:0 auto;}
  nav{padding:24px 0; display:flex; align-items:center; gap:16px;}
  nav a{color:var(--text-muted); text-decoration:none; font-size:13px;}
  nav h1{font-size:20px; font-weight:800; margin:0;}

  .gate{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:32px; text-align:center; color:var(--text-muted);}
  .gate a{color:var(--accent); font-weight:700;}

  textarea{
    width:100%; min-height:200px; padding:14px; border:1px solid var(--border-strong); border-radius:10px;
    font-family:var(--font-body); font-size:14px; background:var(--surface); color:var(--text); resize:vertical;
  }
  .row{display:flex; gap:10px; margin-top:10px; align-items:center; flex-wrap:wrap;}
  input[type=text]{padding:9px 10px; border:1px solid var(--border-strong); border-radius:6px; font-family:var(--font-body); font-size:14px;}
  button.btn{
    padding:11px 22px; background:var(--accent); color:#fff; border:none; border-radius:8px;
    font-family:var(--font-body); font-size:14.5px; font-weight:700; cursor:pointer;
  }
  button.btn:disabled{opacity:.5; cursor:default;}
  .msg{font-size:13.5px; color:var(--danger); margin-top:10px;}
  .loading{font-size:13.5px; color:var(--text-muted); margin-top:10px;}

  .result{margin-top:32px;}
  .sentence-block{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px 18px; margin-bottom:12px;}
  .sentence-block .en{font-size:15px; line-height:1.7; margin-bottom:8px;}
  .sentence-block .ko{font-size:13.5px; color:var(--text-muted); margin-bottom:8px;}
  .sentence-block .notes{font-size:12.5px; color:var(--text-faint); border-top:1px dashed var(--border); padding-top:8px;}
  .badge{display:inline-block; font-size:11px; padding:2px 8px; border-radius:20px; background:var(--accent-soft); color:var(--text-muted); margin-bottom:6px;}

  .summary-box{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:18px; margin-bottom:20px;}
  .summary-box h3{margin:0 0 6px; font-size:14px;}
  .summary-box p{margin:0 0 10px; font-size:13.5px; color:var(--text-muted); line-height:1.6;}

  table.voca{width:100%; border-collapse:collapse; font-size:13px; margin-top:10px;}
  table.voca th, table.voca td{padding:7px 9px; border-bottom:1px solid var(--border); text-align:left;}
  table.voca th{color:var(--text-muted); font-size:12px;}
</style>
</head>
<body>
<div class="wrap">
  <nav><a href="/">← 홈으로</a><h1>지문분석기</h1></nav>

  <div id="gate" class="gate">로그인이 필요해요. <a href="/">홈으로 가서 로그인하기</a></div>

  <div id="content" style="display:none;">
    <textarea id="passageInput" placeholder="영어 지문을 붙여넣으세요."></textarea>
    <div class="row">
      <input type="text" id="targetGrammar" placeholder="목표 어법 (선택, 예: 분사구문)">
      <button class="btn" id="analyzeBtn">분석하기</button>
    </div>
    <div class="loading" id="loadingMsg" style="display:none;">Gemini가 분석 중이에요... (지문 길이에 따라 20초~1분 정도 걸려요)</div>
    <div class="msg" id="errorMsg"></div>

    <div class="result" id="resultBox"></div>
  </div>
</div>

<script>
async function checkAuth(){
  const res = await fetch('/auth/me', {credentials:'include'});
  if(res.ok){
    document.getElementById('gate').style.display = 'none';
    document.getElementById('content').style.display = 'block';
  }
}
checkAuth();

document.getElementById('analyzeBtn').onclick = async () => {
  const passage_text = document.getElementById('passageInput').value.trim();
  const target_grammar = document.getElementById('targetGrammar').value.trim() || null;
  const errorMsg = document.getElementById('errorMsg');
  const loading = document.getElementById('loadingMsg');
  errorMsg.textContent = '';
  if(!passage_text){ errorMsg.textContent = '지문을 입력해주세요.'; return; }

  document.getElementById('analyzeBtn').disabled = true;
  loading.style.display = 'block';
  document.getElementById('resultBox').innerHTML = '';

  try{
    const res = await fetch('/api/passage-analysis', {
      method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include',
      body: JSON.stringify({passage_text, target_grammar})
    });
    if(!res.ok){ throw new Error((await res.json()).detail || '분석에 실패했어요.'); }
    const data = await res.json();
    render(data.result, data.material_id);
  }catch(e){
    errorMsg.textContent = e.message;
  }finally{
    loading.style.display = 'none';
    document.getElementById('analyzeBtn').disabled = false;
  }
};

function render(result, materialId){
  const box = document.getElementById('resultBox');
  box.innerHTML = '';

  if(materialId){
    const dl = document.createElement('a');
    dl.href = `/api/materials/${materialId}/pdf`;
    dl.textContent = 'PDF 다운로드';
    dl.style.cssText = 'display:inline-block; margin-bottom:16px; padding:9px 18px; background:var(--accent); color:#fff; text-decoration:none; border-radius:8px; font-size:13.5px; font-weight:700;';
    box.appendChild(dl);
  }

  if(result.summary){
    const s = result.summary;
    const div = document.createElement('div');
    div.className = 'summary-box';
    div.innerHTML = `<h3>지문 요약</h3>
      <p><strong>주제:</strong> ${s.theme || ''}</p>
      <p><strong>흐름:</strong> ${s.flow || ''}</p>
      <p>${s.background || ''}</p>`;
    box.appendChild(div);
  }

  (result.sentences || []).forEach(sent => {
    const div = document.createElement('div');
    div.className = 'sentence-block';
    const badge = sent.badge ? `<span class="badge">${sent.badge}</span>` : '';
    const enText = (sent.tokens || []).map(t => t.text).join(' ');
    const notes = (sent.notes || []).map(n => `· ${n.text || n.content || ''}`).join('<br>');
    div.innerHTML = `${badge}<div class="en">[${sent.num}] ${enText}</div>
      <div class="ko">${sent.translation || ''}</div>
      <div class="notes">${notes}</div>`;
    box.appendChild(div);
  });

  if(result.vocabulary && result.vocabulary.length){
    const div = document.createElement('div');
    div.className = 'summary-box';
    div.innerHTML = `<h3>핵심 어휘</h3>
      <table class="voca"><thead><tr><th>단어</th><th>뜻</th><th>유의어</th><th>반의어</th></tr></thead>
      <tbody>${result.vocabulary.map(v => `<tr><td>${v.word}</td><td>${v.meaning}</td><td>${v.synonym||''}</td><td>${v.antonym||''}</td></tr>`).join('')}</tbody></table>`;
    box.appendChild(div);
  }
}
</script>
</body>
</html>
