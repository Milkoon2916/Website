<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>단어 퀴즈</title>
<link rel="stylesheet" href="/static/design-tokens.css">
<style>
  *{box-sizing:border-box;}
  body{margin:0; padding:0 20px 80px;}
  .wrap{max-width:560px; margin:0 auto; padding-top:40px;}
  h1{font-size:22px; margin:0 0 4px;}
  .sub{color:var(--text-muted); font-size:13.5px; margin:0 0 24px;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:24px; margin-bottom:16px;}
  .list-pick{padding:12px 14px; border:1px solid var(--border); border-radius:8px; margin-bottom:10px; cursor:pointer;}
  .list-pick:hover{border-color:var(--border-strong);}

  .q-num{font-size:12px; color:var(--text-faint); margin-bottom:6px;}
  .q-word{font-size:26px; font-weight:800; margin:0 0 16px;}
  input#answerInput{
    width:100%; padding:12px; border:1px solid var(--border-strong); border-radius:8px;
    font-family:var(--font-body); font-size:16px;
  }
  button.btn{
    margin-top:12px; width:100%; padding:11px 0; background:var(--accent); color:#fff; border:none;
    border-radius:8px; font-family:var(--font-body); font-size:14.5px; font-weight:700; cursor:pointer;
  }
  .feedback{margin-top:10px; font-size:13.5px;}
  .feedback.correct{color:#2F5233;}
  .feedback.wrong{color:var(--danger);}

  .result-score{font-size:40px; font-weight:800; text-align:center; margin:8px 0;}
  .result-sub{text-align:center; color:var(--text-muted); font-size:14px;}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="studentGreeting">단어 퀴즈</h1>
  <p class="sub">선생님이 알려주신 링크로 접속했어요. 로그인 없이 진행돼요.</p>

  <div id="stage-lists" class="card" style="display:none;">
    <p style="margin-top:0; color:var(--text-muted); font-size:13.5px;">풀 단어장을 선택하세요.</p>
    <div id="listPicker"></div>
  </div>

  <div id="stage-quiz" class="card" style="display:none;">
    <p class="q-num" id="qNum"></p>
    <p class="q-word" id="qWord"></p>
    <input type="text" id="answerInput" placeholder="뜻을 입력하세요" autocomplete="off">
    <button class="btn" id="submitBtn">확인</button>
    <p class="feedback" id="feedback"></p>
  </div>

  <div id="stage-result" class="card" style="display:none;">
    <p class="result-score" id="resultScore"></p>
    <p class="result-sub" id="resultSub"></p>
  </div>

  <div id="stage-error" class="card" style="display:none; color:var(--danger);"></div>
</div>

<script>
const params = new URLSearchParams(location.search);
const code = params.get('code');
let words = [];
let idx = 0;
let correctCount = 0;
let selectedListId = null;

function showStage(id){
  ['stage-lists','stage-quiz','stage-result','stage-error'].forEach(s => {
    document.getElementById(s).style.display = (s === id) ? 'block' : 'none';
  });
}

async function start(){
  if(!code){ showError('링크에 코드가 없어요. 선생님께 받은 링크를 다시 확인해주세요.'); return; }
  try{
    const res = await fetch(`/public/quiz/${code}/lists`);
    if(!res.ok) throw new Error((await res.json()).detail);
    const data = await res.json();
    document.getElementById('studentGreeting').textContent = `${data.student_name}님, 안녕하세요`;
    if(data.word_lists.length === 1){
      selectedListId = data.word_lists[0].id;
      loadWords();
    } else {
      showStage('stage-lists');
      const box = document.getElementById('listPicker');
      data.word_lists.forEach(l => {
        const div = document.createElement('div');
        div.className = 'list-pick';
        div.textContent = l.title;
        div.onclick = () => { selectedListId = l.id; loadWords(); };
        box.appendChild(div);
      });
    }
  }catch(e){ showError(e.message || '학생 코드를 확인할 수 없어요.'); }
}

function showError(msg){
  showStage('stage-error');
  document.getElementById('stage-error').textContent = msg;
}

async function loadWords(){
  const res = await fetch(`/public/quiz/${code}/lists/${selectedListId}/words`);
  words = await res.json();
  idx = 0; correctCount = 0;
  showStage('stage-quiz');
  renderQuestion();
}

function renderQuestion(){
  if(idx >= words.length){ finish(); return; }
  document.getElementById('qNum').textContent = `${idx+1} / ${words.length}`;
  document.getElementById('qWord').textContent = words[idx].english;
  document.getElementById('answerInput').value = '';
  document.getElementById('feedback').textContent = '';
  document.getElementById('answerInput').focus();
}

function checkAnswer(){
  const given = document.getElementById('answerInput').value.trim();
  const correct = words[idx].korean.trim();
  const isCorrect = given === correct || correct.includes(given) && given.length > 0;
  const fb = document.getElementById('feedback');
  if(isCorrect){
    correctCount++;
    fb.textContent = '정답이에요!';
    fb.className = 'feedback correct';
  } else {
    fb.textContent = `아쉬워요. 정답: ${correct}`;
    fb.className = 'feedback wrong';
  }
  idx++;
  setTimeout(renderQuestion, 900);
}

document.getElementById('submitBtn').onclick = checkAnswer;
document.getElementById('answerInput').addEventListener('keydown', e => { if(e.key === 'Enter') checkAnswer(); });

async function finish(){
  const score = Math.round((correctCount / words.length) * 100);
  showStage('stage-result');
  document.getElementById('resultScore').textContent = `${score}점`;
  document.getElementById('resultSub').textContent = `${words.length}문제 중 ${correctCount}개 정답`;

  await fetch(`/public/quiz/${code}/results`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({list_id: selectedListId, score, detail:{correct: correctCount, total: words.length}})
  });
}

start();
</script>
</body>
</html>
