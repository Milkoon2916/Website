<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>단어장 퀴즈 · 학습자료 제작소</title>
<link rel="stylesheet" href="/static/design-tokens.css">
<style>
  *{box-sizing:border-box;}
  body{margin:0; padding:0 20px 80px;}
  .wrap{max-width:920px; margin:0 auto;}
  nav{padding:24px 0; display:flex; align-items:center; gap:16px;}
  nav a{color:var(--text-muted); text-decoration:none; font-size:13px;}
  nav h1{font-size:20px; font-weight:800; margin:0;}

  .gate{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:32px; text-align:center; color:var(--text-muted);}
  .gate a{color:var(--accent); font-weight:700;}

  .tabs{display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap;}
  .tab{
    padding:9px 16px; border:1px solid var(--border); background:var(--surface); border-radius:8px;
    font-family:var(--font-body); font-size:13.5px; color:var(--text-muted); cursor:pointer;
  }
  .tab.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  .panel{display:none;}
  .panel.active{display:block;}

  .row{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
  input[type=text], input[type=number], select{
    padding:9px 10px; border:1px solid var(--border-strong); border-radius:6px;
    font-family:var(--font-body); font-size:14px; background:var(--surface); color:var(--text);
  }
  button.btn{
    padding:9px 16px; background:var(--accent); color:#fff; border:none; border-radius:6px;
    font-family:var(--font-body); font-size:13.5px; cursor:pointer;
  }
  button.btn.secondary{background:var(--surface); color:var(--text-muted); border:1px solid var(--border);}
  button.btn.danger{background:var(--danger-soft); color:var(--danger); border:1px solid var(--danger);}

  .list-col{display:flex; gap:20px; align-items:flex-start;}
  .side{width:220px; flex-shrink:0;}
  .main-col{flex:1; min-width:0;}

  .item-card{
    background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:10px 12px;
    margin-bottom:8px; cursor:pointer; font-size:14px;
  }
  .item-card.selected{border-color:var(--accent); background:var(--accent-soft);}
  .item-card .count{color:var(--text-faint); font-size:12px;}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th, td{padding:8px 10px; border-bottom:1px solid var(--border); text-align:left;}
  th{color:var(--text-muted); font-weight:700; font-size:12.5px;}
  .del-link{color:var(--danger); font-size:12px; cursor:pointer;}

  .quota{font-size:12px; color:var(--text-faint); margin-bottom:16px;}
  .msg{font-size:13px; color:var(--danger); margin-top:8px;}
</style>
</head>
<body>
<div class="wrap">
  <nav><a href="/">← 홈으로</a><h1>단어장 퀴즈</h1></nav>

  <div id="gate" class="gate">로그인이 필요해요. <a href="/">홈으로 가서 로그인하기</a></div>

  <div id="content" style="display:none;">
    <div class="tabs">
      <button class="tab active" data-panel="words">단어 관리</button>
      <button class="tab" data-panel="students">학생 관리</button>
      <button class="tab" data-panel="results">결과 보기</button>
    </div>

    <!-- ---------- 단어 관리 ---------- -->
    <div class="panel active" id="panel-words">
      <div class="list-col">
        <div class="side">
          <div class="row" style="margin-bottom:10px;">
            <input type="text" id="newListTitle" placeholder="새 단어장 이름">
            <button class="btn" id="addListBtn">추가</button>
          </div>
          <p class="quota" id="listQuota"></p>
          <div id="listList"></div>
        </div>
        <div class="main-col">
          <div class="row">
            <input type="text" id="wordEn" placeholder="영어">
            <input type="text" id="wordKo" placeholder="뜻">
            <input type="text" id="wordEx" placeholder="예문(선택)">
            <button class="btn" id="addWordBtn">단어 추가</button>
          </div>
          <p class="quota" id="wordQuota"></p>
          <table>
            <thead><tr><th>영어</th><th>뜻</th><th>예문</th><th></th></tr></thead>
            <tbody id="wordTableBody"></tbody>
          </table>
          <div class="msg" id="wordMsg"></div>
        </div>
      </div>
    </div>

    <!-- ---------- 학생 관리 ---------- -->
    <div class="panel" id="panel-students">
      <div class="row">
        <input type="text" id="stuName" placeholder="학생 이름">
        <input type="text" id="stuCode" placeholder="접속 코드 (예: stu001)">
        <input type="text" id="stuClass" placeholder="반(선택)">
        <button class="btn" id="addStuBtn">학생 등록</button>
      </div>
      <p class="quota" id="stuQuota"></p>
      <table>
        <thead><tr><th>이름</th><th>코드</th><th>반</th><th>학생용 링크</th><th></th></tr></thead>
        <tbody id="stuTableBody"></tbody>
      </table>
      <div class="msg" id="stuMsg"></div>
    </div>

    <!-- ---------- 결과 보기 ---------- -->
    <div class="panel" id="panel-results">
      <table>
        <thead><tr><th>학생</th><th>단어장</th><th>점수</th><th>제출 시각</th></tr></thead>
        <tbody id="resultTableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
let currentListId = null;
let wordListsCache = [];
let studentsCache = [];

async function api(path, opts={}){
  const res = await fetch(path, {credentials:'include', headers:{'Content-Type':'application/json'}, ...opts});
  if(!res.ok){
    const err = await res.json().catch(()=>({detail:'오류가 발생했어요.'}));
    throw new Error(err.detail || '오류가 발생했어요.');
  }
  return res.status === 204 ? null : res.json();
}

async function init(){
  try{
    const me = await api('/auth/me');
    document.getElementById('gate').style.display = 'none';
    document.getElementById('content').style.display = 'block';
    await loadWordLists();
    await loadStudents();
    await loadResults();
  }catch(e){
    document.getElementById('gate').style.display = 'block';
    document.getElementById('content').style.display = 'none';
  }
}

// ---------- 탭 전환 ----------
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.panel).classList.add('active');
  });
});

// ---------- 단어장 ----------
async function loadWordLists(){
  wordListsCache = await api('/api/word-lists');
  document.getElementById('listQuota').textContent = `단어장 ${wordListsCache.length} / 100`;
  const box = document.getElementById('listList');
  box.innerHTML = '';
  wordListsCache.forEach(l => {
    const div = document.createElement('div');
    div.className = 'item-card' + (l.id === currentListId ? ' selected' : '');
    div.textContent = l.title;
    div.onclick = () => { currentListId = l.id; loadWordLists(); loadWords(); };
    box.appendChild(div);
  });
  if(!currentListId && wordListsCache.length) currentListId = wordListsCache[0].id;
  if(currentListId) loadWords();
}

document.getElementById('addListBtn').onclick = async () => {
  const title = document.getElementById('newListTitle').value.trim();
  if(!title) return;
  try{
    await api('/api/word-lists', {method:'POST', body: JSON.stringify({title})});
    document.getElementById('newListTitle').value = '';
    await loadWordLists();
  }catch(e){ document.getElementById('wordMsg').textContent = e.message; }
};

async function loadWords(){
  if(!currentListId) return;
  const words = await api(`/api/word-lists/${currentListId}/words`);
  const totalWords = await countAllWords();
  document.getElementById('wordQuota').textContent = `전체 단어 ${totalWords} / 5000`;
  const body = document.getElementById('wordTableBody');
  body.innerHTML = '';
  words.forEach(w => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${w.english}</td><td>${w.korean}</td><td>${w.example||''}</td>
      <td><span class="del-link" data-id="${w.id}">삭제</span></td>`;
    tr.querySelector('.del-link').onclick = async () => {
      await api(`/api/words/${w.id}`, {method:'DELETE'});
      loadWords();
    };
    body.appendChild(tr);
  });
}

async function countAllWords(){
  // 단어장별 개수를 다 더해서 대략치 표시 (정확한 합계는 서버가 저장 시점에 체크함)
  let total = 0;
  for(const l of wordListsCache){
    if(l.id === currentListId){
      total += document.querySelectorAll('#wordTableBody tr').length;
    }
  }
  return total; // 간단 표시용
}

document.getElementById('addWordBtn').onclick = async () => {
  if(!currentListId){ document.getElementById('wordMsg').textContent = '먼저 단어장을 선택하거나 만들어주세요.'; return; }
  const english = document.getElementById('wordEn').value.trim();
  const korean = document.getElementById('wordKo').value.trim();
  const example = document.getElementById('wordEx').value.trim() || null;
  if(!english || !korean) return;
  try{
    await api(`/api/word-lists/${currentListId}/words`, {method:'POST', body: JSON.stringify({english, korean, example})});
    document.getElementById('wordEn').value=''; document.getElementById('wordKo').value=''; document.getElementById('wordEx').value='';
    document.getElementById('wordMsg').textContent = '';
    loadWords();
  }catch(e){ document.getElementById('wordMsg').textContent = e.message; }
};

// ---------- 학생 ----------
async function loadStudents(){
  studentsCache = await api('/api/students');
  document.getElementById('stuQuota').textContent = `학생 ${studentsCache.length} / 100`;
  const body = document.getElementById('stuTableBody');
  body.innerHTML = '';
  studentsCache.forEach(s => {
    const link = `${location.origin}/quiz.html?code=${s.access_code}`;
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${s.name}</td><td>${s.access_code}</td><td>${s.class_group||''}</td>
      <td style="font-size:12px; color:var(--text-faint);">${link}</td>
      <td><span class="del-link" data-id="${s.id}">삭제</span></td>`;
    tr.querySelector('.del-link').onclick = async () => {
      await api(`/api/students/${s.id}`, {method:'DELETE'});
      loadStudents();
    };
    body.appendChild(tr);
  });
}

document.getElementById('addStuBtn').onclick = async () => {
  const name = document.getElementById('stuName').value.trim();
  const access_code = document.getElementById('stuCode').value.trim();
  const class_group = document.getElementById('stuClass').value.trim() || null;
  if(!name || !access_code) return;
  try{
    await api('/api/students', {method:'POST', body: JSON.stringify({name, access_code, class_group})});
    document.getElementById('stuName').value=''; document.getElementById('stuCode').value=''; document.getElementById('stuClass').value='';
    document.getElementById('stuMsg').textContent = '';
    loadStudents();
  }catch(e){ document.getElementById('stuMsg').textContent = e.message; }
};

// ---------- 결과 ----------
async function loadResults(){
  const results = await api('/api/results');
  const studentMap = Object.fromEntries(studentsCache.map(s => [s.id, s.name]));
  const listMap = Object.fromEntries(wordListsCache.map(l => [l.id, l.title]));
  const body = document.getElementById('resultTableBody');
  body.innerHTML = '';
  results.forEach(r => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${studentMap[r.student_id] || '#'+r.student_id}</td>
      <td>${listMap[r.list_id] || '#'+r.list_id}</td>
      <td>${r.score}</td><td>${(r.submitted_at||'').replace('T',' ').slice(0,16)}</td>`;
    body.appendChild(tr);
  });
}

init();
</script>
</body>
</html>
