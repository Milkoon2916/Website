<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>어법 문제 만들기 샘플 · 학습자료 제작소</title>
<link rel="stylesheet" href="/static/design-tokens.css">
<style>
  *{box-sizing:border-box;}
  body{margin:0; padding:0 20px 80px;}
  .wrap{max-width:820px; margin:0 auto;}
  nav{padding:24px 0; display:flex; align-items:center; gap:16px;}
  nav a{color:var(--text-muted); text-decoration:none; font-size:13px;}
  nav h1{font-size:20px; font-weight:800; margin:0;}

  .cta{
    background:var(--accent); color:#fff; border-radius:var(--radius); padding:20px 24px;
    display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:28px;
  }
  .cta p{margin:0; font-size:14px; line-height:1.6; color:rgba(255,255,255,.85);}
  .cta p strong{color:#fff;}
  .cta a{
    flex-shrink:0; background:#fff; color:var(--accent); text-decoration:none; font-weight:800; font-size:13.5px;
    padding:10px 20px; border-radius:8px;
  }
  .sample-tag{display:inline-block; font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px; background:var(--accent-soft); color:var(--text-muted); margin-bottom:14px;}

  .hint{font-size:12px; color:var(--text-faint); margin-top:5px;}
  .badge{display:inline-block; font-size:11px; padding:2px 8px; border-radius:20px; background:var(--accent-soft); color:var(--text-muted); margin-bottom:6px;}
  .block{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:12px;}
  .sentence-block{background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin-bottom:8px;}
</style>
</head>
<body>
<div class="wrap">
  <nav><a href="/">← 홈으로</a><h1>어법 문제 만들기</h1></nav>

  <div class="cta">
    <p><strong>이 화면은 샘플이에요.</strong><br>어법 문제 만들기로 만들면 이런 문법 테스트가 나와요(워드 다운로드 가능). 실제 지문으로 만들려면 통합 생성을 이용해주세요.</p>
    <a href="/generate/">통합 생성에서 만들기 →</a>
  </div>

  <span class="sample-tag">샘플 결과</span>
  <div id="resultArea"></div>
</div>

<script>
const CIRCLED = ['①','②','③','④','⑤','⑥','⑦','⑧'];

const SAMPLE_RESULT = {
  target_grammar: "명사절 접속사 that / 관계대명사 that",
  questions: [
    {
      num: 1, tag: "명사절 접속사", type: "choice_parens",
      instruction: "괄호 안에서 어법상 알맞은 것을 고르시오.",
      sentence: "Cognitive scientists have found ___ the brain grows fastest at the exact moment we get something wrong.",
      choices: ["that", "what", "which", "who"], answer_index: 0
    },
    {
      num: 2, tag: "주어-동사 수일치", type: "choose_sentence",
      instruction: "다음 중 어법상 옳은 문장을 고르시오.",
      choices: [
        "Our brain releases a burst of electrical activity that strengthen the neural pathways.",
        "Our brain releases a burst of electrical activity that strengthens the neural pathways.",
        "Our brain releases a burst of electrical activity strengthening that the neural pathways."
      ],
      answer_index: 1
    },
    {
      num: 3, tag: "어순 배열", type: "order_words",
      instruction: "주어진 단어를 배열하여 문장을 완성하시오.",
      korean_hint: "실수는, 뒤따르는 올바른 설명과 함께, 우리를 더 많이 가르칠 수 있다.",
      words: ["a wrong answer,", "followed by the right explanation,", "can teach us more"],
      answer: "A wrong answer, followed by the right explanation, can teach us more."
    }
  ]
};

function render(result){
  const box = document.getElementById('resultArea');
  let html = `<p class="hint" style="margin-bottom:14px;">목표 어법: ${result.target_grammar||''}</p>`;

  (result.questions || []).forEach(q => {
    let body = '';
    if(q.type === 'choice_parens' || q.type === 'fill_blank_choice'){
      const choiceLine = (q.choices||[]).map((c,i)=>`${CIRCLED[i]} ${c}`).join('&nbsp;&nbsp;&nbsp;');
      body = `<div class="sentence-block">${q.sentence}</div><div style="margin-bottom:8px;">${choiceLine}</div>
        <div class="hint">정답: ${CIRCLED[q.answer_index??0]}</div>`;
    } else if(q.type === 'choose_sentence'){
      const lines = (q.choices||[]).map((c,i)=>`<div>${CIRCLED[i]} ${c}</div>`).join('');
      body = `<div style="margin-bottom:8px;">${lines}</div><div class="hint">정답: ${CIRCLED[q.answer_index??0]}</div>`;
    } else if(q.type === 'order_words'){
      body = `<div class="hint" style="margin-bottom:6px;">${q.korean_hint||''}</div>
        <div class="sentence-block">${(q.words||[]).join(' / ')}</div>
        <div class="hint">정답: ${q.answer||''}</div>`;
    } else if(q.type === 'rewrite'){
      body = `<div class="sentence-block">${q.sentence||''}</div>
        <div class="hint">정답: ${q.answer||''}</div>`;
    }
    html += `<div class="block">
      <span class="badge">${q.tag||''}</span>
      <div style="font-weight:700; margin:4px 0 8px;">${q.num}. ${q.instruction||''}</div>
      ${body}
    </div>`;
  });
  box.innerHTML = html;
}

render(SAMPLE_RESULT);
</script>
</body>
</html>
