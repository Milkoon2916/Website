<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>통합 생성 · 학습자료 제작소</title>
<link rel="stylesheet" href="/static/design-tokens.css">
<style>
  *{box-sizing:border-box;}
  body{margin:0; padding:0 20px 80px;}
  .wrap{max-width:940px; margin:0 auto;}
  nav{padding:24px 0; display:flex; align-items:center; gap:16px;}
  nav a{color:var(--text-muted); text-decoration:none; font-size:13px;}
  nav h1{font-size:20px; font-weight:800; margin:0;}
  .sub{color:var(--text-muted); font-size:13px; margin:-8px 0 20px;}

  .gate{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:32px; text-align:center; color:var(--text-muted);}
  .gate a{color:var(--accent); font-weight:700;}

  textarea{
    width:100%; min-height:160px; padding:14px; border:1px solid var(--border-strong); border-radius:10px;
    font-family:var(--font-body); font-size:14px; background:var(--surface); color:var(--text); resize:vertical;
  }
  .row{display:flex; gap:10px; margin-top:10px; align-items:center; flex-wrap:wrap;}
  input[type=text]{padding:9px 10px; border:1px solid var(--border-strong); border-radius:6px; font-family:var(--font-body); font-size:14px;}
  button.btn{
    padding:11px 22px; background:var(--accent); color:#fff; border:none; border-radius:8px;
    font-family:var(--font-body); font-size:14.5px; font-weight:700; cursor:pointer;
  }
  button.btn:disabled{opacity:.5;}
  button.btn.small{padding:7px 14px; font-size:13px;}
  button.btn.ghost{background:var(--surface); color:var(--text-muted); border:1px solid var(--border);}
  button.btn.danger-ghost{background:var(--surface); color:var(--danger); border:1px solid var(--danger);}
  .msg{font-size:13.5px; color:var(--danger); margin-top:10px;}
  .loading{font-size:13.5px; color:var(--text-muted); margin-top:10px;}

  /* ---------- 지문 카드(여러 개) ---------- */
  .passage-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px 18px; margin-bottom:14px;
  }
  .passage-card .p-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .passage-card .p-num{font-size:13px; font-weight:800; color:var(--text-muted);}
  .passages-hint{font-size:12px; color:var(--text-faint); margin:8px 0 20px;}
  #addPassageBtn{margin-top:0;}

  .status-row{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;}
  .status-chip{font-size:12px; padding:5px 12px; border-radius:20px; border:1px solid var(--border); color:var(--text-muted);}
  .status-chip.done{background:var(--accent-soft); color:var(--text); border-color:var(--border-strong);}
  .status-chip.error{background:var(--danger-soft); color:var(--danger); border-color:var(--danger);}
  .status-chip.pending{color:var(--text-faint);}

  .step-tabs{display:flex; gap:8px; margin:16px 0 16px; flex-wrap:wrap;}
  .step-tab{padding:8px 14px; border:1px solid var(--border); background:var(--surface); border-radius:8px; font-size:13px; cursor:pointer;}
  .step-tab.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  .step-panel{display:none;}
  .step-panel.active{display:block;}

  .sentence-block, .block, .summary-box{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:10px;}
  .sentence-block .en, .block{font-size:14px;}
  .sentence-block .ko{font-size:13px; color:var(--text-muted); margin-top:5px;}
  .sentence-block .notes{font-size:12px; color:var(--text-faint); border-top:1px dashed var(--border); padding-top:6px; margin-top:6px;}
  .badge{display:inline-block; font-size:11px; padding:2px 8px; border-radius:20px; background:var(--accent-soft); color:var(--text-muted); margin-bottom:6px;}
  .hint{font-size:12px; color:var(--text-faint); margin-top:5px;}

  .voca-list{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px 16px;}
  .voca-row{display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:1px solid var(--border); font-size:14px;}
  .voca-row:last-child{border-bottom:none;}
  .voca-row .meaning{color:var(--text-muted); font-size:13px;}
  .voca-actions{margin-top:14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .voca-actions .ok{font-size:12.5px; color:var(--text-muted);}

  .dl-link{
    display:inline-block; margin-bottom:12px; padding:8px 16px; background:var(--accent); color:#fff;
    text-decoration:none; border-radius:8px; font-size:13px; font-weight:700;
  }

  .picker{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-top:4px;}
  .picker .picker-title{font-size:13px; font-weight:700; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;}
  .picker .picker-title .links button{background:none; border:none; color:var(--text-muted); font-size:12px; cursor:pointer; text-decoration:underline; font-family:var(--font-body);}
  .materials-grid{display:flex; gap:10px; flex-wrap:wrap;}
  .material-check{display:flex; align-items:center; gap:6px; font-size:13.5px; padding:7px 12px; border-radius:8px; background:var(--bg); border:1px solid var(--border);}
  .material-check input{accent-color:var(--accent);}
  .steps-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:7px;}
  .step-check{display:flex; align-items:center; gap:6px; font-size:12.5px; padding:5px 8px; border-radius:6px; background:var(--bg);}
  .step-check input{accent-color:var(--accent);}
  #workbookStepsPicker{display:none; margin-top:10px; padding-top:10px; border-top:1px dashed var(--border);}
  #oxCountPicker{display:none; margin-top:10px; padding-top:10px; border-top:1px dashed var(--border);}
  .ox-count-row{display:flex; gap:20px; flex-wrap:wrap;}
  .ox-count-field{display:flex; align-items:center; gap:8px; font-size:13px;}
  .ox-count-field input{width:60px; padding:6px 8px; border:1px solid var(--border-strong); border-radius:6px; font-family:var(--font-body); font-size:13px;}
  .ox-passage-box{background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:12px 14px; margin-bottom:10px; font-size:13.5px; line-height:1.7; white-space:pre-wrap;}

  /* ---------- 지문별 결과 섹션 ---------- */
  .passage-result{margin-top:32px; padding-top:24px; border-top:2px solid var(--border);}
  .passage-result .pr-head{font-size:16px; font-weight:800; margin:0 0 10px;}
</style>
</head>
<body>
<div class="wrap">
  <nav><a href="/">← 홈으로</a><h1>통합 생성</h1></nav>
  <p class="sub">지문을 한 개 이상 넣고, 원하는 자료를 골라 한 번에 만들어요.</p>

  <div id="gate" class="gate">로그인이 필요해요. <a href="/">홈으로 가서 로그인하기</a></div>

  <div id="content" style="display:none;">
    <div id="passagesList"></div>
    <div class="row">
      <button class="btn ghost small" id="addPassageBtn" type="button">+ 지문 추가</button>
    </div>
    <p class="passages-hint">지문을 여러 개 넣으면 카드 순서대로 하나씩 처리돼요(Gemini 무료 키의 분당 요청 한도 때문에 동시에 처리하지 않아요). 3개 이하를 권장하고, 최대 5개까지 추가할 수 있어요.</p>

    <div class="picker">
      <div class="picker-title"><span>만들 자료 선택 (모든 지문에 공통 적용)</span></div>
      <div class="materials-grid" id="materialsGrid"></div>

      <div id="workbookStepsPicker">
        <div class="picker-title">
          <span>워크북 단계 선택</span>
          <span class="links"><button id="stepsAllBtn" type="button">전체 선택</button> · <button id="stepsNoneBtn" type="button">전체 해제</button></span>
        </div>
        <div class="steps-grid" id="workbookStepsGrid"></div>
      </div>

      <div id="oxCountPicker">
        <div class="picker-title"><span>O/X 문항 수</span></div>
        <div class="ox-count-row">
          <label class="ox-count-field">한글 <input type="number" id="oxKoreanCount" value="10" min="1" max="20"></label>
          <label class="ox-count-field">영어 <input type="number" id="oxEnglishCount" value="5" min="1" max="20"></label>
        </div>
      </div>
    </div>

    <div class="row">
      <button class="btn" id="genBtn">선택한 자료 만들기</button>
    </div>
    <div class="loading" id="loadingMsg" style="display:none;"></div>
    <div class="msg" id="errorMsg"></div>

    <div id="resultsContainer"></div>
  </div>
</div>

<script>
const MATERIAL_LABELS = {analysis:'지문분석', workbook:'워크북', ox:'O/X', grammar_quiz:'목표어법 문제'};
const STEP_LABELS = {
  step2: "1. 빈칸(우리말)", step3: "2. 빈칸(영문)",
  step4: "3. 해석 연습하기", step5: "4. 동사형 연습하기", step6: "5. 어법·어휘 고르기",
  step7: "6. 어색한 곳 찾기", step8: "7. 순서 배열하기", step9: "8. 문단 배열하기",
  step10: "9. 영작 연습하기", final_check: "Final Check (최종 점검)",
};
const MAX_PASSAGES = 5;

/* ---------- 지문 카드 여러 개 관리 ---------- */
const passagesList = document.getElementById('passagesList');
let passageCount = 0;

function addPassageCard(){
  if(passageCount >= MAX_PASSAGES) return;
  passageCount++;
  const idx = passageCount;
  const card = document.createElement('div');
  card.className = 'passage-card';
  card.dataset.idx = idx;
  card.innerHTML = `
    <div class="p-head">
      <span class="p-num">지문 ${idx}</span>
      <button class="btn small danger-ghost remove-passage-btn" type="button" style="display:none;">이 지문 삭제</button>
    </div>
    <div class="row" style="margin-top:0; margin-bottom:8px;">
      <input type="text" class="p-title" placeholder="자료 제목 (선택)">
      <input type="text" class="p-target-grammar" placeholder="목표 어법 (선택, 예: 분사구문)">
    </div>
    <textarea class="p-passage" placeholder="영어 지문을 붙여넣으세요."></textarea>
  `;
  passagesList.appendChild(card);
  card.querySelector('.remove-passage-btn').onclick = () => {
    card.remove();
    renumberPassageCards();
  };
  renumberPassageCards();
}

function renumberPassageCards(){
  const cards = Array.from(passagesList.querySelectorAll('.passage-card'));
  passageCount = cards.length;
  cards.forEach((card, i) => {
    card.querySelector('.p-num').textContent = `지문 ${i + 1}`;
    card.querySelector('.remove-passage-btn').style.display = cards.length > 1 ? 'inline-block' : 'none';
  });
  document.getElementById('addPassageBtn').disabled = cards.length >= MAX_PASSAGES;
}

addPassageCard();
document.getElementById('addPassageBtn').onclick = addPassageCard;

/* ---------- 자료/단계/OX 개수 선택 UI (모든 지문 공통) ---------- */
const materialsGrid = document.getElementById('materialsGrid');
Object.keys(MATERIAL_LABELS).forEach(key => {
  const label = document.createElement('label');
  label.className = 'material-check';
  label.innerHTML = `<input type="checkbox" class="material-cb" value="${key}" checked> ${MATERIAL_LABELS[key]}`;
  materialsGrid.appendChild(label);
});

const workbookStepsGrid = document.getElementById('workbookStepsGrid');
Object.keys(STEP_LABELS).forEach(s => {
  const label = document.createElement('label');
  label.className = 'step-check';
  label.innerHTML = `<input type="checkbox" class="wstep-cb" value="${s}" checked> ${STEP_LABELS[s]}`;
  workbookStepsGrid.appendChild(label);
});
document.getElementById('stepsAllBtn').onclick = () => document.querySelectorAll('.wstep-cb').forEach(c => c.checked = true);
document.getElementById('stepsNoneBtn').onclick = () => document.querySelectorAll('.wstep-cb').forEach(c => c.checked = false);

function syncWorkbookStepsVisibility(){
  const workbookChecked = document.querySelector('.material-cb[value=workbook]').checked;
  document.getElementById('workbookStepsPicker').style.display = workbookChecked ? 'block' : 'none';
  const oxChecked = document.querySelector('.material-cb[value=ox]').checked;
  document.getElementById('oxCountPicker').style.display = oxChecked ? 'block' : 'none';
}
materialsGrid.addEventListener('change', syncWorkbookStepsVisibility);
syncWorkbookStepsVisibility();

async function checkAuth(){
  const res = await fetch('/auth/me', {credentials:'include'});
  if(res.ok){
    document.getElementById('gate').style.display = 'none';
    document.getElementById('content').style.display = 'block';
  }
}
checkAuth();

/* ---------- 생성 실행: 지문 카드 순서대로 하나씩 처리 ---------- */
document.getElementById('genBtn').onclick = async () => {
  const cards = Array.from(passagesList.querySelectorAll('.passage-card'));
  const passages = cards.map(card => ({
    title: card.querySelector('.p-title').value.trim() || null,
    target_grammar: card.querySelector('.p-target-grammar').value.trim() || null,
    passage_text: card.querySelector('.p-passage').value.trim(),
  }));
  const materials = Array.from(document.querySelectorAll('.material-cb:checked')).map(c => c.value);
  const workbook_steps = Array.from(document.querySelectorAll('.wstep-cb:checked')).map(c => c.value);
  const ox_korean_count = parseInt(document.getElementById('oxKoreanCount').value, 10) || 10;
  const ox_english_count = parseInt(document.getElementById('oxEnglishCount').value, 10) || 5;
  const errorMsg = document.getElementById('errorMsg');
  const loading = document.getElementById('loadingMsg');
  errorMsg.textContent = '';

  if(passages.some(p => !p.passage_text)){ errorMsg.textContent = '모든 지문 칸을 채워주세요 (비어있는 지문이 있어요).'; return; }
  if(!materials.length){ errorMsg.textContent = '만들 자료를 하나 이상 선택해주세요.'; return; }
  if(materials.includes('workbook') && !workbook_steps.length){ errorMsg.textContent = '워크북 단계를 하나 이상 선택해주세요.'; return; }

  document.getElementById('genBtn').disabled = true;
  document.getElementById('resultsContainer').innerHTML = '';

  for(let i = 0; i < passages.length; i++){
    const p = passages[i];
    loading.style.display = 'block';
    loading.textContent = passages.length > 1
      ? `지문 ${i + 1}/${passages.length} 처리 중... (Gemini가 자료를 만드는 중이에요, 20초~2분 걸려요)`
      : 'Gemini가 자료를 만드는 중이에요... (지문 길이·선택 개수에 따라 20초~2분 걸려요)';

    const section = createPassageResultSection(i, p.title, materials);
    document.getElementById('resultsContainer').appendChild(section);

    try{
      const res = await fetch('/api/generate-all', {
        method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include',
        body: JSON.stringify({
          passage_text: p.passage_text, target_grammar: p.target_grammar, title: p.title,
          materials, workbook_steps, ox_korean_count, ox_english_count,
        })
      });
      if(!res.ok){ throw new Error((await res.json()).detail || '생성에 실패했어요.'); }
      const data = await res.json();
      fillPassageStatus(section, materials, data);
      buildTabs(section, materials, data.materials);
      renderAll(section, data.materials, workbook_steps, p.passage_text);
    }catch(e){
      section.querySelector('.status-row').innerHTML =
        `<span class="status-chip error">지문 ${i + 1} 생성 실패: ${e.message}</span>`;
    }
  }

  loading.style.display = 'none';
  document.getElementById('genBtn').disabled = false;
};

function createPassageResultSection(idx, title, materials){
  const section = document.createElement('section');
  section.className = 'passage-result';
  section.dataset.idx = idx;
  const heading = title ? `지문 ${idx + 1} · ${title}` : `지문 ${idx + 1}`;
  section.innerHTML = `
    <h3 class="pr-head">${escapeHtmlGen(heading)}</h3>
    <div class="status-row">${materials.map(k => `<span class="status-chip pending">${MATERIAL_LABELS[k]} 생성 중...</span>`).join('')}</div>
    <div class="step-tabs"></div>
    <div class="result-panels">
      <div class="step-panel" data-key="analysis"></div>
      <div class="step-panel" data-key="workbook"></div>
      <div class="step-panel" data-key="ox"></div>
      <div class="step-panel" data-key="grammar_quiz"></div>
      <div class="step-panel" data-key="vocab"></div>
    </div>
  `;
  return section;
}

function fillPassageStatus(section, materials, data){
  const statusRow = section.querySelector('.status-row');
  statusRow.innerHTML = '';
  materials.forEach(key => {
    const chip = document.createElement('span');
    if(data.materials[key]){
      chip.className = 'status-chip done';
      chip.textContent = `${MATERIAL_LABELS[key]} 완료`;
    } else {
      chip.className = 'status-chip error';
      chip.textContent = `${MATERIAL_LABELS[key]} 실패: ${data.errors[key] || '오류'}`;
    }
    statusRow.appendChild(chip);
  });
}

function buildTabs(section, selectedMaterials, resultMaterials){
  const topTabs = section.querySelector('.step-tabs');
  topTabs.innerHTML = '';
  section.querySelectorAll('.step-panel').forEach(p => p.classList.remove('active'));

  const tabKeys = selectedMaterials.filter(k => resultMaterials[k]);
  if(selectedMaterials.includes('analysis') && resultMaterials.analysis) tabKeys.push('vocab');

  tabKeys.forEach((key, i) => {
    const tab = document.createElement('div');
    tab.className = 'step-tab' + (i === 0 ? ' active' : '');
    tab.textContent = key === 'vocab' ? '단어 (체크박스)' : MATERIAL_LABELS[key];
    const panel = section.querySelector(`.step-panel[data-key="${key}"]`);
    tab.onclick = () => {
      topTabs.querySelectorAll('.step-tab').forEach(t => t.classList.remove('active'));
      section.querySelectorAll('.step-panel').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      panel.classList.add('active');
    };
    topTabs.appendChild(tab);
    if(i === 0) panel.classList.add('active');
  });
}

function dlButton(materialId){
  return `<a class="dl-link" href="/api/materials/${materialId}/pdf">PDF 다운로드</a>`;
}

function panel(section, key){
  return section.querySelector(`.step-panel[data-key="${key}"]`);
}

function renderAll(section, materials, workbookSteps, passageText){
  if(materials.analysis) renderAnalysis(section, materials.analysis.result, materials.analysis.material_id);
  if(materials.workbook) renderWorkbook(section, materials.workbook.result, materials.workbook.material_id, workbookSteps);
  if(materials.ox) renderOx(section, materials.ox.result, materials.ox.material_id, passageText);
  if(materials.grammar_quiz) renderGrammarQuiz(section, materials.grammar_quiz.result, materials.grammar_quiz.material_id);

  const vocabWords = (materials.analysis && materials.analysis.result.vocabulary) || [];
  renderVocabCheckboxes(section, vocabWords);
}

const BADGE_KO = {topic:'주제문', insert:'문장삽입', target:'목표 어법'};
const BADGE_COLOR = {topic:'#17324d', insert:'#2e9e6b', target:'#8b3fa0'};
const TAG_COLOR = {g:'#d3222a', v:'#2266cc', gv:'#8b3fa0'};
const NOTE_LABEL = {comprehension:'독해 포인트', grammar:'어법 포인트', blank:'빈칸', writing:'서술형', implication:'함의추론', theme:'주제'};
const NOTE_COLOR = {comprehension:'#3a7bd5', grammar:'#d3222a', blank:'#e08a1e', writing:'#2e9e6b', implication:'#8b3fa0', theme:'#17324d'};

function renderAnalysis(section, result, materialId){
  const box = panel(section, 'analysis');
  let html = dlButton(materialId);

  html += `<div class="summary-box" style="margin-bottom:14px;">
    <h3 style="margin:0 0 4px;">${result.title_en||''}</h3>
    <p class="hint" style="margin:0 0 8px;">${result.title_kr||''}</p>`;
  if(result.target_grammar){
    html += `<p style="color:#8b3fa0; font-weight:700; font-size:13px; margin:0 0 8px;">목표 어법: ${result.target_grammar}</p>`;
  }
  if(result.summary){
    html += `<p><strong>주제:</strong> ${result.summary.theme||''}</p>
      <p><strong>흐름:</strong> ${result.summary.flow||''}</p>
      <p>${result.summary.background||''}</p>`;
  }
  html += `</div>`;

  (result.sentences||[]).forEach(sent => {
    const badgeKey = sent.badge;
    const badge = badgeKey && BADGE_KO[badgeKey]
      ? `<span class="badge" style="background:${BADGE_COLOR[badgeKey]}; color:#fff;">${BADGE_KO[badgeKey]}</span> `
      : '';
    const enHtml = (sent.tokens||[]).map(t => {
      if(t.type === 'tag'){
        const color = TAG_COLOR[t.tag_class] || TAG_COLOR.g;
        return `<span style="display:inline-block; text-align:center; vertical-align:top; margin:0 1px;">
          <span style="color:${color}; font-weight:700;">${t.text}</span>
          <span style="display:block; font-size:9px; color:#8a8a8a; line-height:1.2;">${t.caption||''}</span>
        </span>`;
      }
      if(t.type === 'conn') return `<span style="text-decoration:underline; text-decoration-color:#999;">${t.text}</span>`;
      if(t.type === 'hl') return `<span style="background:#fff2a8;">${t.text}</span>`;
      return t.text;
    }).join(' ');
    const notes = (sent.notes||[]).map(n => {
      const label = NOTE_LABEL[n.category] || '포인트';
      const color = NOTE_COLOR[n.category] || '#6B6B66';
      return `<div style="margin-top:6px;"><span style="display:inline-block; font-size:10px; font-weight:700; color:#fff; background:${color}; padding:1px 7px; border-radius:8px; margin-bottom:3px;">${sent.num}번 ${label}</span><div>${n.body||''}</div></div>`;
    }).join('');
    html += `<div class="sentence-block">${badge}<span style="display:inline-block; background:#17324d; color:#fff; width:16px; height:16px; text-align:center; line-height:16px; font-size:11px; border-radius:50%; margin-right:4px;">${sent.num}</span><span class="en">${enHtml}</span>
      <div class="ko">${sent.translation||''}</div><div class="notes">${notes}</div></div>`;
  });

  if(result.vocabulary && result.vocabulary.length){
    html += `<h3 style="margin:16px 0 8px;">핵심 어휘 &amp; 유의어·반의어</h3><div class="voca-list">`;
    result.vocabulary.forEach(v => {
      html += `<div class="voca-row"><strong>${v.word}</strong> <span class="meaning">${v.meaning||''}</span>
        <span class="hint" style="margin-left:auto;">유의어: ${v.synonym||'-'} / 반의어: ${v.antonym||'-'}</span></div>`;
    });
    html += `</div>`;
  }

  box.innerHTML = html;
}

function renderWorkbook(section, result, materialId, steps){
  steps = steps && steps.length ? steps : ['step2','step3','step4','step5','step6','step7','step8','step9','step10','final_check'];
  const box = panel(section, 'workbook');
  box.innerHTML = '';
  box.appendChild(Object.assign(document.createElement('div'), {innerHTML: dlButton(materialId)}));

  const innerTabs = document.createElement('div');
  innerTabs.className = 'step-tabs';
  innerTabs.style.margin = '10px 0 14px';
  const innerPanels = document.createElement('div');
  box.appendChild(innerTabs);
  box.appendChild(innerPanels);

  steps.forEach((s, i) => {
    const tab = document.createElement('div');
    tab.className = 'step-tab' + (i === 0 ? ' active' : '');
    tab.textContent = STEP_LABELS[s];
    const wbPanel = document.createElement('div');
    wbPanel.className = 'step-panel' + (i === 0 ? ' active' : '');
    wbPanel.innerHTML = renderWorkbookStep(s, result);
    tab.onclick = () => {
      innerTabs.querySelectorAll('.step-tab').forEach(t => t.classList.remove('active'));
      innerPanels.querySelectorAll('.step-panel').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      wbPanel.classList.add('active');
    };
    innerTabs.appendChild(tab);
    innerPanels.appendChild(wbPanel);
  });
}

function renderWorkbookStep(step, result){
  const units = result.units || [];
  if(step === 'step2'){
    return '<div class="hint" style="margin-bottom:10px;">영문을 보고 우리말 해석의 빈칸을 완성해 보세요.</div>' +
      units.map(u => `<div class="block">${u.num}. ${u.en}<div class="ko">${u.ko_blanked}</div></div>`).join('');
  }
  if(step === 'step3'){
    return '<div class="hint" style="margin-bottom:10px;">우리말 해석을 보고 영문의 빈칸을 완성해 보세요.</div>' +
      units.map(u => `<div class="block">${u.num}. ${u.ko}<div>${u.en_blanked}</div></div>`).join('');
  }
  if(step === 'step4'){
    return '<div class="hint" style="margin-bottom:10px;">문장 전체의 자연스러운 해석을 써 보세요.</div>' +
      units.map(u => `<div class="block">${u.num}. ${u.en}<div class="hint">(직접 해석을 써 보세요)</div></div>`).join('');
  }
  if(step === 'step5'){
    return '<div class="hint" style="margin-bottom:10px;">괄호 안에 주어진 단어를 알맞게 고쳐 쓰세요.</div>' +
      units.map(u => `<div class="block">${u.num}. ${u.ko}<div>${u.verb_prompt_en}</div></div>`).join('');
  }
  if(step === 'step6'){
    return '<div class="hint" style="margin-bottom:10px;">괄호 안에서 옳은 어법과 어휘를 골라 보세요.</div>' +
      units.map(u => `<div class="block">${u.num}. ${u.ko}<div>${u.choice_prompt_en}</div></div>`).join('');
  }
  if(step === 'step7'){
    const ft = result.flawed_text;
    if(!ft) return '<p class="hint">생성된 데이터가 없어요.</p>';
    const passage = (ft.underlined_items||[]).map(it => `<span style="text-decoration:underline; font-weight:700;">${it.text}</span>`).join(' ');
    const wrongCount = (ft.underlined_items||[]).filter(it => it.is_wrong).length;
    const answerLines = Array.from({length: wrongCount}, (_, i) => `<div class="hint">(${i+1}) ______________ → ______________</div>`).join('');
    return '<div class="hint" style="margin-bottom:10px;">밑줄 친 부분 중 어법상 어색한 것을 찾아 알맞게 고쳐 쓰세요.</div>' +
      `<div class="block">${passage}</div>${answerLines}`;
  }
  if(step === 'step8'){
    return '<div class="hint" style="margin-bottom:10px;">단어를 배열하여 문장을 완성해 보세요.</div>' +
      units.map(u => `<div class="block">${u.num}. ${u.ko}<div style="margin-top:4px; font-size:14px; letter-spacing:0.2px;">${(u.word_order_words||[]).join(' / ')}</div></div>`).join('');
  }
  if(step === 'step9'){
    const po = result.paragraph_order;
    if(!po) return '<p class="hint">생성된 데이터가 없어요.</p>';
    const chunks = (po.chunks||[]).map(c => `<div style="margin-bottom:8px;">(${c.label}) ${c.text}</div>`).join('');
    return '<div class="hint" style="margin-bottom:10px;">다음 문단을 흐름상 알맞게 배열해 보세요.</div>' +
      `<div class="block" style="border-color:var(--text);"><div style="margin-bottom:10px;">${po.intro_en}</div>${chunks}</div>
      <div class="hint">______ → ______ → ______</div>`;
  }
  if(step === 'step10'){
    return '<div class="hint" style="margin-bottom:10px;">우리말과 같은 뜻이 되도록 주어진 단어를 순서대로 사용하여 영작하세요.</div>' +
      units.map(u => `<div class="block">${u.num}. ${u.ko}<div class="badge">${(u.given_words_for_writing||[]).join(', ')}</div><div class="hint">(직접 영작을 써 보세요)</div></div>`).join('');
  }
  if(step === 'final_check'){
    const fc = result.final_check;
    if(!fc || !(fc.blocks||[]).length) return '<p class="hint">생성된 데이터가 없어요.</p>';
    const legend = `<div class="hint" style="margin-bottom:10px;">
      <span style="color:#D3222A;font-weight:700;">빈칸</span> 어휘/문법 빈칸 &nbsp;
      <strong>[A / B]</strong> 어법·어휘 고르기 &nbsp;
      <span style="color:#2E9E6B;font-weight:700;">순서배열</span> 단어 배열 &nbsp;
      <span style="text-decoration:underline; font-weight:700;">밑줄</span> 영작
    </div>`;
    const blocks = fc.blocks.map(b => {
      const en = (b.segments||[]).map(seg => {
        if(seg.type === 'blank') return `<span style="color:#D3222A;font-weight:700;">빈칸</span>${'\u2003'.repeat(seg.word_count||1)}<sup>${seg.num})</sup>`;
        if(seg.type === 'choice') return `<strong>[${(seg.choices||[]).join(' / ')}]</strong><sup>${seg.num})</sup>`;
        if(seg.type === 'order') return `<span style="color:#2E9E6B;font-weight:700;">순서배열</span>(${(seg.words||[]).join(', ')})<sup>${seg.num})</sup>`;
        if(seg.type === 'writing') return `<span style="text-decoration:underline; font-weight:700;">${seg.prompt_ko||''}</span>(${(seg.given_words||[]).join(', ')})<sup>${seg.num})</sup>`;
        return seg.text || '';
      }).join('');
      return `<div class="block">${b.num}. ${en}<div class="ko">${b.ko||''}</div></div>`;
    }).join('');
    return legend + blocks;
  }
  return '';
}

function renderOx(section, result, materialId, passageText){
  const box = panel(section, 'ox');
  let html = dlButton(materialId);
  if(passageText){
    html += `<h4>지문</h4><div class="ox-passage-box">${escapeHtmlGen(passageText)}</div>`;
  }
  html += `<h4>한글 O/X (${(result.korean_ox||[]).length}문항)</h4>`;
  (result.korean_ox||[]).forEach(it => html += `<div class="block">[${it.num}] ${it.statement} <strong>(${it.answer?'O':'X'})</strong></div>`);
  html += `<h4>영어 O/X (${(result.english_ox||[]).length}문항)</h4>`;
  (result.english_ox||[]).forEach(it => html += `<div class="block">[${it.num}] ${it.statement} <strong>(${it.answer?'O':'X'})</strong></div>`);
  box.innerHTML = html;
}

function escapeHtmlGen(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

const CIRCLED = ['①','②','③','④','⑤','⑥','⑦','⑧'];

function renderGrammarQuiz(section, result, materialId){
  const box = panel(section, 'grammar_quiz');
  let html = '';
  if(materialId){
    html += `<a class="dl-link" href="/api/materials/${materialId}/docx" style="background:var(--text); margin-right:8px;">워드 다운로드 (편집 가능)</a>`;
  }
  html += `<p class="hint" style="margin:8px 0 14px;">목표 어법: ${result.target_grammar||''}</p>`;

  (result.questions||[]).forEach(q => {
    let body = '';
    if(q.type === 'choice_parens' || q.type === 'fill_blank_choice'){
      const choiceLine = (q.choices||[]).map((c,i)=>`${CIRCLED[i]} ${c}`).join('&nbsp;&nbsp;&nbsp;');
      body = `<div class="sentence-block" style="margin-bottom:6px;">${q.sentence}</div><div style="margin-bottom:10px;">${choiceLine}</div>
        <div class="hint">정답: ${CIRCLED[q.answer_index??0]}</div>`;
    } else if(q.type === 'choose_sentence'){
      const lines = (q.choices||[]).map((c,i)=>`<div>${CIRCLED[i]} ${c}</div>`).join('');
      body = `<div style="margin-bottom:10px;">${lines}</div><div class="hint">정답: ${CIRCLED[q.answer_index??0]}</div>`;
    } else if(q.type === 'order_words'){
      body = `<div class="hint" style="margin-bottom:6px;">${q.korean_hint||''}</div>
        <div class="sentence-block" style="margin-bottom:6px;">${(q.words||[]).join(' / ')}</div>
        <div class="hint">정답: ${q.answer||''}</div>`;
    } else if(q.type === 'rewrite'){
      body = `<div class="sentence-block" style="margin-bottom:6px;">${q.sentence||''}</div>
        <div class="hint">정답: ${q.answer||''}</div>`;
    }
    html += `<div class="block" style="margin-bottom:14px;">
      <span class="badge">${q.tag||''}</span>
      <div style="font-weight:700; margin:4px 0 8px;">${q.num}. ${q.instruction||''}</div>
      ${body}
    </div>`;
  });
  box.innerHTML = html;
}

function renderVocabCheckboxes(section, words){
  const box = panel(section, 'vocab');
  if(!words.length){ box.innerHTML = '<p class="hint">추출된 단어가 없어요.</p>'; return; }
  let html = '<div class="voca-list">';
  words.forEach((w, i) => {
    html += `<label class="voca-row">
      <input type="checkbox" class="voca-check" data-idx="${i}" checked>
      <strong>${w.word}</strong> <span class="meaning">${w.meaning||''}</span>
    </label>`;
  });
  html += '</div>';
  const defaultName = (section.querySelector('.pr-head')?.textContent || '지문') + ' 단어';
  html += `<div class="voca-actions">
    <input type="text" class="wordListName" placeholder="담을 단어장 이름 (새로 생성됨)" value="${escapeHtmlGen(defaultName)}">
    <button class="btn small addToWordListBtn" type="button">체크한 단어 단어장에 추가</button>
    <span class="ok wordListMsg"></span>
  </div>`;
  box.innerHTML = html;

  box.querySelector('.addToWordListBtn').onclick = () => addCheckedWordsToList(box, words);
}

async function addCheckedWordsToList(box, words){
  const checked = Array.from(box.querySelectorAll('.voca-check:checked')).map(c => words[c.dataset.idx]);
  const msg = box.querySelector('.wordListMsg');
  if(!checked.length){ msg.textContent = '선택된 단어가 없어요.'; return; }

  const listName = box.querySelector('.wordListName').value.trim() || '지문 단어';
  msg.textContent = '추가 중...';
  try{
    const listRes = await fetch('/api/word-lists', {
      method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include',
      body: JSON.stringify({title: listName})
    });
    if(!listRes.ok) throw new Error((await listRes.json()).detail);
    const list = await listRes.json();

    for(const w of checked){
      await fetch(`/api/word-lists/${list.id}/words`, {
        method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include',
        body: JSON.stringify({english: w.word, korean: w.meaning, example: null})
      });
    }
    msg.textContent = `"${listName}" 단어장에 ${checked.length}개 추가 완료!`;
  }catch(e){
    msg.textContent = '실패: ' + e.message;
  }
}
