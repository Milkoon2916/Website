<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>워크북 메이커 샘플 · 학습자료 제작소</title>
<link rel="stylesheet" href="/static/design-tokens.css">
<style>
  *{box-sizing:border-box;}
  body{margin:0; padding:0 20px 80px;}
  .wrap{max-width:920px; margin:0 auto;}
  nav{padding:24px 0; display:flex; align-items:center; gap:16px;}
  nav a{color:var(--text-muted); text-decoration:none; font-size:13px;}
  nav h1{font-size:20px; font-weight:800; margin:0;}

  .cta{
    background:var(--accent); color:#fff; border-radius:var(--radius); padding:20px 24px;
    display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:28px;
  }
  .cta p{margin:0; font-size:14px; line-height:1.6; color:rgba(255,255,255,.85);}
  .cta p strong{color:#fff;}
  .cta a{
    flex-shrink:0; background:#fff; color:var(--accent); text-decoration:none; font-weight:800; font-size:13.5px;
    padding:10px 20px; border-radius:8px;
  }
  .sample-tag{display:inline-block; font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px; background:var(--accent-soft); color:var(--text-muted); margin-bottom:14px;}

  .step-tabs{display:flex; gap:8px; margin:0 0 16px; flex-wrap:wrap;}
  .step-tab{padding:8px 14px; border:1px solid var(--border); background:var(--surface); border-radius:8px; font-size:13px; cursor:pointer;}
  .step-tab.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  .step-panel{display:none;}
  .step-panel.active{display:block;}

  .unit-block{background:var(--surface); border:1px dashed var(--border-strong); border-radius:10px; padding:14px 16px; margin-bottom:10px; font-size:14px; line-height:1.7;}
  .unit-block .ko{color:var(--text-muted); font-size:13px; margin-top:4px;}
  .hint{font-size:12px; color:var(--text-faint); margin-top:6px;}
  .instruction{font-size:13px; font-weight:700; color:var(--accent); margin-bottom:12px;}

  .word-order-box{margin-top:4px; font-size:14px; letter-spacing:0.2px;}
  .flawed-box{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:14px; line-height:2;}
  .flawed-box .u{text-decoration:underline; font-weight:700;}
  .order-box{background:var(--surface); border:1px solid var(--text); border-radius:10px; padding:16px; margin-bottom:12px;}
  .order-box .chunk{margin-bottom:8px;}
  .writing-hint{background:var(--accent-soft); color:var(--text); font-size:12.5px; padding:5px 10px; border-radius:6px; display:inline-block; margin:6px 0;}

  .fc-tag{display:inline-block; font-size:10px; font-weight:700; padding:1px 6px; border-radius:8px; color:#fff;}
  .fc-blank{background:#D3222A;}
  .fc-order{background:#2E9E6B;}
  .fc-block-num{display:inline-block; background:var(--text); color:#fff; width:18px; height:18px; text-align:center; line-height:18px; border-radius:50%; font-size:11px; margin-right:6px;}
</style>
</head>
<body>
<div class="wrap">
  <nav><a href="/">← 홈으로</a><h1>워크북 메이커</h1></nav>

  <div class="cta">
    <p><strong>이 화면은 샘플이에요.</strong><br>워크북 메이커로 만들면 이런 단계별 학습지가 나와요. 실제 지문으로 만들려면 통합 생성을 이용해주세요.</p>
    <a href="/generate/">통합 생성에서 만들기 →</a>
  </div>

  <span class="sample-tag">샘플 결과</span>
  <div class="step-tabs" id="stepTabs"></div>
  <div id="stepPanels"></div>
</div>

<script>
const STEP_LABELS = {
  step2: "1. 빈칸(우리말)", step3: "2. 빈칸(영문)",
  step5: "3. 동사형 연습하기", step6: "4. 어법·어휘 고르기",
  step7: "5. 어색한 곳 찾기", step9: "6. 문단 배열하기",
  final_check: "Final Check (최종 점검)",
};
const STEPS = Object.keys(STEP_LABELS);

const SAMPLE_RESULT = {
  units: [
    {
      num: 1,
      en: "Many students believe that making a mistake is something to avoid at all costs.",
      ko: "많은 학생들은 실수하는 것을 어떻게든 피해야 한다고 생각한다.",
      ko_blanked: "많은 학생들은 ______ 하는 것을 어떻게든 피해야 한다고 생각한다.",
      en_blanked: "Many students believe that making a ______ is something to avoid at all costs.",
      verb_prompt_en: "Many students believe that making a mistake (be) something to avoid at all costs.",
      choice_prompt_en: "Many students believe that making a mistake is something [to avoid / avoiding] at all costs.",
      word_order_words: ["Many", "students", "believe", "that", "making", "a", "mistake", "is", "something", "to", "avoid", "at", "all", "costs"],
      given_words_for_writing: ["students", "mistake", "avoid"]
    },
    {
      num: 2,
      en: "However, cognitive scientists have found that the brain grows fastest at the exact moment we get something wrong.",
      ko: "하지만 인지 과학자들은 우리가 무언가를 틀리는 바로 그 순간에 뇌가 가장 빠르게 성장한다는 것을 발견했다.",
      ko_blanked: "하지만 인지 과학자들은 우리가 무언가를 틀리는 바로 그 순간에 뇌가 가장 ______ 성장한다는 것을 발견했다.",
      en_blanked: "However, cognitive scientists have found that the brain ______ fastest at the exact moment we get something wrong.",
      verb_prompt_en: "However, cognitive scientists have found that the brain (grow) fastest at the exact moment we get something wrong.",
      choice_prompt_en: "However, cognitive scientists have found that the brain grows [fast / fastest] at the exact moment we get something wrong.",
      word_order_words: ["cognitive", "scientists", "have", "found", "that", "the", "brain", "grows", "fastest"],
      given_words_for_writing: ["scientists", "brain", "fastest"]
    }
  ],
  flawed_text: {
    underlined_items: [
      {text:"fail", is_wrong:false},
      {text:"releases", is_wrong:false},
      {text:"strengthen", is_wrong:true},
      {text:"connect", is_wrong:true}
    ]
  },
  paragraph_order: {
    intro_en: "다음 문장들을 흐름상 알맞게 배열해 보세요.",
    chunks: [
      {label:"A", text:"This means a wrong answer, followed by the right explanation, can teach us more than getting it right the first time."},
      {label:"B", text:"Many students believe that making a mistake is something to avoid at all costs."},
      {label:"C", text:"However, cognitive scientists have found that the brain grows fastest at the exact moment we get something wrong."}
    ]
  },
  final_check: {
    blocks: [
      {
        num: 1,
        ko: "많은 학생들은 실수하는 것을 어떻게든 피해야 한다고 생각한다.",
        segments: [
          {type:"text", text:"Many students believe that making a "},
          {type:"blank", num:1},
          {type:"text", text:" is something to avoid at all costs."}
        ]
      },
      {
        num: 2,
        ko: "하지만 인지 과학자들은 우리가 무언가를 틀리는 바로 그 순간에 뇌가 가장 빠르게 성장한다는 것을 발견했다.",
        segments: [
          {type:"text", text:"However, cognitive scientists have found that the brain grows "},
          {type:"choice", num:2, choices:["fast", "fastest"]},
          {type:"text", text:" at the exact moment we "},
          {type:"order", num:3, words:["get", "something", "wrong"]},
          {type:"text", text:"."}
        ]
      }
    ]
  }
};

function renderStep(step, result){
  const units = result.units || [];
  if(step === 'step2'){
    return '<div class="instruction">영문을 보고 우리말 해석의 빈칸을 완성해 보세요.</div>' +
      units.map(u => `<div class="unit-block">${u.num}. ${u.en}<div class="ko">${u.ko_blanked}</div></div>`).join('');
  }
  if(step === 'step3'){
    return '<div class="instruction">우리말 해석을 보고 영문의 빈칸을 완성해 보세요.</div>' +
      units.map(u => `<div class="unit-block">${u.num}. ${u.ko}<div>${u.en_blanked}</div></div>`).join('');
  }
  if(step === 'step5'){
    return '<div class="instruction">괄호 안에 주어진 단어를 알맞게 고쳐 쓰세요.</div>' +
      units.map(u => `<div class="unit-block">${u.num}. ${u.ko}<div>${u.verb_prompt_en}</div></div>`).join('');
  }
  if(step === 'step6'){
    return '<div class="instruction">괄호 안에서 옳은 어법과 어휘를 골라 보세요.</div>' +
      units.map(u => `<div class="unit-block">${u.num}. ${u.ko}<div>${u.choice_prompt_en}</div></div>`).join('');
  }
  if(step === 'step7'){
    const ft = result.flawed_text;
    if(!ft) return '<p class="hint">생성된 데이터가 없어요.</p>';
    const passage = (ft.underlined_items||[]).map(it => `<span class="u">${it.text}</span>`).join(' ');
    const wrongCount = (ft.underlined_items||[]).filter(it => it.is_wrong).length;
    const answerLines = Array.from({length: wrongCount}, (_, i) => `<div class="hint">(${i+1}) ______________ → ______________</div>`).join('');
    return '<div class="instruction">밑줄 친 부분 중 어법상 어색한 것을 찾아 알맞게 고쳐 쓰세요.</div>' +
      `<div class="flawed-box">${passage}</div>${answerLines}`;
  }
  if(step === 'step9'){
    const po = result.paragraph_order;
    if(!po) return '<p class="hint">생성된 데이터가 없어요.</p>';
    const chunks = (po.chunks||[]).map(c => `<div class="chunk">(${c.label}) ${c.text}</div>`).join('');
    return '<div class="instruction">다음 문단을 흐름상 알맞게 배열해 보세요.</div>' +
      `<div class="order-box"><div style="margin-bottom:10px;">${po.intro_en}</div>${chunks}</div>
      <div class="hint">______ → ______ → ______</div>`;
  }
  if(step === 'final_check'){
    const fc = result.final_check;
    if(!fc || !fc.blocks) return '<p class="hint">생성된 데이터가 없어요.</p>';
    const renderSeg = (seg) => {
      if(seg.type === 'text') return seg.text;
      if(seg.type === 'blank') return ` <span class="fc-tag fc-blank">빈칸</span>${'_'.repeat(10)} <sup>${seg.num})</sup>`;
      if(seg.type === 'choice') return ` <b>[${seg.choices[0]} / ${seg.choices[1]}]</b><sup>${seg.num})</sup>`;
      if(seg.type === 'order') return ` <span class="fc-tag fc-order">순서배열</span>(${(seg.words||[]).join(', ')})<sup>${seg.num})</sup>`;
      return '';
    };
    return '<div class="instruction">영문과 해석을 읽으며 빈칸·어법·순서배열을 한 번에 점검해 보세요.</div>' +
      fc.blocks.map(b => `<div class="unit-block"><span class="fc-block-num">${b.num}</span>${b.segments.map(renderSeg).join('')}<div class="ko">${b.ko}</div></div>`).join('');
  }
  return '';
}

const tabsBox = document.getElementById('stepTabs');
const panelsBox = document.getElementById('stepPanels');
STEPS.forEach((s, i) => {
  const tab = document.createElement('div');
  tab.className = 'step-tab' + (i === 0 ? ' active' : '');
  tab.textContent = STEP_LABELS[s];
  tab.onclick = () => {
    document.querySelectorAll('.step-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.step-panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + s).classList.add('active');
  };
  tabsBox.appendChild(tab);

  const panel = document.createElement('div');
  panel.className = 'step-panel' + (i === 0 ? ' active' : '');
  panel.id = 'panel-' + s;
  panel.innerHTML = renderStep(s, SAMPLE_RESULT);
  panelsBox.appendChild(panel);
});
</script>
</body>
</html>
