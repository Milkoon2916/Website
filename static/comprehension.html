<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O/X 리딩 워크북 샘플 · 학습자료 제작소</title>
<link rel="stylesheet" href="/static/design-tokens.css">
<style>
  *{box-sizing:border-box;}
  body{margin:0; padding:0 20px 80px;}
  .wrap{max-width:820px; margin:0 auto;}
  nav{padding:24px 0; display:flex; align-items:center; gap:16px;}
  nav a{color:var(--text-muted); text-decoration:none; font-size:13px;}
  nav h1{font-size:20px; font-weight:800; margin:0;}

  .cta{
    background:var(--accent); color:#fff; border-radius:var(--radius); padding:20px 24px;
    display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:28px;
  }
  .cta p{margin:0; font-size:14px; line-height:1.6; color:rgba(255,255,255,.85);}
  .cta p strong{color:#fff;}
  .cta a{
    flex-shrink:0; background:#fff; color:var(--accent); text-decoration:none; font-weight:800; font-size:13.5px;
    padding:10px 20px; border-radius:8px;
  }
  .sample-tag{display:inline-block; font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px; background:var(--accent-soft); color:var(--text-muted); margin-bottom:14px;}

  h3.section{font-size:15px; margin:28px 0 12px;}
  .ox-item{
    background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:12px 14px;
    margin-bottom:8px; display:flex; justify-content:space-between; gap:16px; align-items:center; font-size:14px;
  }
  .ox-answer{font-size:12px; font-weight:800; padding:2px 10px; border-radius:20px; flex-shrink:0;}
  .ox-answer.true{background:#E6ECE1; color:#2F5233;}
  .ox-answer.false{background:var(--danger-soft); color:var(--danger);}

  .passage-box{background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:14px 16px;
    margin-bottom:16px; font-size:13.5px; line-height:1.7; white-space:pre-wrap;}
</style>
</head>
<body>
<div class="wrap">
  <nav><a href="/">← 홈으로</a><h1>O/X 리딩 워크북</h1></nav>

  <div class="cta">
    <p><strong>이 화면은 샘플이에요.</strong><br>O/X 리딩 워크북으로 만들면 이런 내용일치 문제가 나와요. 실제 지문으로 만들려면 통합 생성을 이용해주세요.</p>
    <a href="/generate/">통합 생성에서 만들기 →</a>
  </div>

  <span class="sample-tag">샘플 결과</span>
  <div id="resultArea"></div>
</div>

<script>
const SAMPLE_PASSAGE = "Many students believe that making a mistake is something to avoid at all costs. However, cognitive scientists have found that the brain grows fastest at the exact moment we get something wrong. When we fail, our brain releases a burst of electrical activity that strengthens the neural pathways connected to that memory. This means a wrong answer, followed by the right explanation, can teach us more than getting it right the first time.";

const SAMPLE_RESULT = {
  korean_ox: [
    {num:1, statement:"이 글에 따르면 대부분의 학생들은 실수를 피하고 싶어 한다.", answer:true},
    {num:2, statement:"인지 과학자들은 실수했을 때 뇌 활동이 줄어든다고 밝혔다.", answer:false},
    {num:3, statement:"뇌는 실패의 순간에 전기 활동을 방출하여 관련 신경 경로를 강화한다.", answer:true},
    {num:4, statement:"이 글은 정답을 처음부터 맞히는 것이 실수 후 배우는 것보다 항상 낫다고 주장한다.", answer:false},
    {num:5, statement:"실수 후에 올바른 설명이 뒤따르면 학습에 도움이 될 수 있다.", answer:true}
  ],
  english_ox: [
    {num:1, statement:"The passage states that mistakes should always be avoided.", answer:false},
    {num:2, statement:"According to the passage, the brain releases electrical activity when we get something wrong.", answer:true},
    {num:3, statement:"The passage argues that a wrong answer can never be more useful than a correct one.", answer:false}
  ]
};

function renderItems(items){
  return (items || []).map(it => `
    <div class="ox-item">
      <span>[${it.num}] ${it.statement}</span>
      <span class="ox-answer ${it.answer}">${it.answer ? 'O' : 'X'}</span>
    </div>`).join('');
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function render(result, passageText){
  const box = document.getElementById('resultArea');
  box.innerHTML = `
    <h3 class="section" style="margin-top:0;">지문</h3><div class="passage-box">${escapeHtml(passageText)}</div>
    <h3 class="section">한글 O/X (${(result.korean_ox||[]).length}문항)</h3>
    ${renderItems(result.korean_ox)}
    <h3 class="section">영어 O/X (${(result.english_ox||[]).length}문항)</h3>
    ${renderItems(result.english_ox)}
  `;
}

render(SAMPLE_RESULT, SAMPLE_PASSAGE);
</script>
</body>
</html>
